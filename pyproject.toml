[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viettrios"
version = "0.1.0"
description = "Viet Trios: a Python-like ecosystem in Vietnamese without accents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Viet Trios Team" }]
license = { text = "MIT" }
keywords = ["viet", "python", "ecosystem", "cli", "script"]
dependencies = []

[project.scripts]
vtr = "viettrios.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
