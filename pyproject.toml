[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "viettrios"
version = "0.4.0"
description = "Viet Trios: Ngon ngu lap trinh cap cao theo phong cach Python/Go, viet bang tieng Viet khong dau"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Viet Trios Community" }]
license = { text = "MIT" }
keywords = ["viet", "python", "go", "lap trinh", "ngon ngu", "tieng viet"]
dependencies = []

[project.scripts]
vtr = "viettrios.cli_v2:main"

[project.urls]
Homepage = "https://github.com/traingheoblpb-netizen/viet-trios"
Documentation = "https://viettrios.dev/docs"
Repository = "https://github.com/traingheoblpb-netizen/viet-trios"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
